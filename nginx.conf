# Webserver-Einstellungen für die Rotondo-Website
# Datenschutz: Es werden keine Zugriffsprotokolle (IP-Adressen der Besucher) gespeichert.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keine Zugriffsprotokolle
    access_log off;
    # Nur schwere Serverfehler protokollieren (keine normalen Besucheranfragen)
    error_log /dev/stderr crit;

    location / {
        try_files $uri $uri/ =404;
    }
}
