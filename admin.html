<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotondo – Neuigkeiten verwalten</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #EDE3D0;
    --cream-light: #F7F1E4;
    --espresso: #3A2A1E;
    --espresso-soft: #5B4535;
    --copper: #B54A1F;
    --forest: #3F5C3A;
    --mustard: #D9A441;
    --line: rgba(58,42,30,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    color:var(--espresso);
    font-family:'Karla', sans-serif;
    display:flex;
    justify-content:center;
    padding:60px 20px;
  }
  h1,h2{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  .wrap{ width:100%; max-width:520px; }
  .logo{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.3rem;
    display:flex; align-items:center; gap:10px;
    margin-bottom:36px;
  }
  .logo .cup-mark{ width:28px; height:25px; display:inline-block; flex-shrink:0; }

  .card{
    background:var(--cream-light);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 30px;
    margin-bottom:24px;
  }
  .card h1{ font-size:1.6rem; margin-bottom:22px; }

  label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--espresso-soft);
    margin-bottom:6px;
    margin-top:18px;
  }
  label:first-of-type{ margin-top:0; }
  input, textarea{
    width:100%;
    font-family:'Karla', sans-serif;
    font-size:1rem;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--espresso);
  }
  textarea{ resize:vertical; }
  input:focus, textarea:focus{
    outline:2px solid var(--copper);
    outline-offset:1px;
  }

  .btn{
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size:0.92rem;
    padding:12px 22px;
    border-radius:100px;
    border:1.5px solid var(--espresso);
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .btn-solid{ background:var(--espresso); color:var(--cream-light); }
  .btn-solid:hover{ background:var(--copper); border-color:var(--copper); transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--espresso); }
  .btn-ghost:hover{ background:var(--espresso); color:var(--cream-light); }
  .btn-ghost.small{ padding:7px 14px; font-size:0.78rem; }

  form .btn{ margin-top:22px; width:100%; }
  #login-box .btn{ margin-top:22px; width:100%; }

  .error{
    color:var(--copper);
    font-size:0.85rem;
    margin-top:14px;
    min-height:1em;
  }

  .admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
  }

  .existing-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .existing-item:last-child{ border-bottom:none; }
  .muted{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color:var(--espresso-soft);
  }
  .hint{
    font-size:0.85rem;
    color:var(--espresso-soft);
  }

  input[type="file"]{
    padding:10px 14px;
    background:#fff;
    cursor:pointer;
  }
  .preview-wrap{
    margin-top:12px;
    display:none;
  }
  .preview-wrap img{
    max-width:100%;
    max-height:180px;
    border-radius:10px;
    border:1px solid var(--line);
    display:block;
  }
  .remove-image{
    margin-top:8px;
    background:none;
    border:none;
    color:var(--copper);
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .upload-progress{
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
    color:var(--espresso-soft);
    margin-top:8px;
    display:none;
  }
  .existing-item{ align-items:flex-start; }
  .existing-item img{
    width:48px;
    height:48px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .existing-item .row-main{
    display:flex;
    gap:12px;
    align-items:center;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <svg class="cup-mark" viewBox="0 0 44 40" aria-hidden="true">
      <!-- Dampf -->
      <path d="M12 19 q3 -6 0 -11" fill="none" stroke="var(--copper)" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
      <path d="M19 17 q3 -6 0 -11" fill="none" stroke="var(--copper)" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
      <path d="M26 19 q3 -6 0 -11" fill="none" stroke="var(--copper)" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
      <!-- Tasse -->
      <path d="M8 20 H30 V29 A11 11 0 0 1 8 29 Z" fill="none" stroke="var(--espresso)" stroke-width="2" stroke-linejoin="round"/>
      <!-- Henkel -->
      <path d="M30 22 h3.2 a3.7 3.7 0 0 1 0 7 h-3.2" fill="none" stroke="var(--espresso)" stroke-width="2" stroke-linecap="round"/>
      <!-- Kaffeelinie -->
      <path d="M11 22.5 Q19 25 27 22.5" fill="none" stroke="var(--copper)" stroke-width="1.3" opacity="0.75" stroke-linecap="round"/>
      <!-- Theke -->
      <line x1="3" y1="35" x2="35" y2="35" stroke="var(--espresso)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Rotondo · Verwaltung
  </div>

  <div id="login-box" class="card">
    <h1>Anmelden</h1>
    <label for="email">E-Mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Passwort</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login-btn" class="btn btn-solid" type="button">Anmelden</button>
    <p id="login-error" class="error"></p>
  </div>

  <div id="admin-box" class="card" style="display:none;">
    <div class="admin-header">
      <h1>Neuigkeit posten</h1>
      <button id="logout-btn" class="btn btn-ghost small" type="button">Abmelden</button>
    </div>

    <form id="news-form">
      <label for="title">Titel</label>
      <input id="title" type="text" required placeholder="z. B. Diesen Samstag später am Stand">

      <label for="text">Text</label>
      <textarea id="text" rows="4" required placeholder="Kurze Nachricht für deine Kund*innen …"></textarea>

      <label for="date">Datum</label>
      <input id="date" type="date">

      <label for="image">Bild (optional)</label>
      <input id="image" type="file" accept="image/*">
      <div class="preview-wrap" id="preview-wrap">
        <img id="preview-img" alt="Vorschau">
        <button type="button" class="remove-image" id="remove-image">Bild entfernen</button>
      </div>
      <p class="upload-progress" id="upload-progress">Bild wird verkleinert …</p>

      <button class="btn btn-solid" type="submit">Veröffentlichen</button>
    </form>
    <p id="post-error" class="error"></p>
  </div>

  <div id="list-box" class="card" style="display:none;">
    <h2 style="font-size:1.2rem; margin-bottom:16px;">Bisherige Neuigkeiten</h2>
    <p class="hint" id="list-hint">Lädt …</p>
    <div id="existing-list"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, getDocs, deleteDoc, doc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginBox = document.getElementById('login-box');
  const adminBox = document.getElementById('admin-box');
  const listBox = document.getElementById('list-box');
  const loginError = document.getElementById('login-error');
  const postError = document.getElementById('post-error');

  document.getElementById('login-btn').addEventListener('click', async () => {
    loginError.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = 'Anmeldung fehlgeschlagen. E-Mail oder Passwort prüfen.';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginBox.style.display = 'none';
      adminBox.style.display = 'block';
      listBox.style.display = 'block';
      loadExisting();
    } else {
      loginBox.style.display = 'block';
      adminBox.style.display = 'none';
      listBox.style.display = 'none';
    }
  });

  const imageInput = document.getElementById('image');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg = document.getElementById('preview-img');
  const uploadProgress = document.getElementById('upload-progress');
  let selectedImageDataUrl = null;

  // Verkleinert und komprimiert ein Bild im Browser, bevor es gespeichert wird.
  // So bleibt jedes Foto klein genug, um direkt in der Datenbank gespeichert
  // zu werden (kein separater Speicherdienst nötig, kostenlos).
  function resizeAndCompressImage(file, maxDimension = 1200, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDimension) {
          height = Math.round(height * (maxDimension / width));
          width = maxDimension;
        } else if (height > maxDimension) {
          width = Math.round(width * (maxDimension / height));
          height = maxDimension;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  imageInput.addEventListener('change', async () => {
    const file = imageInput.files[0];
    if (!file) return;
    postError.textContent = '';
    uploadProgress.textContent = 'Bild wird verkleinert …';
    uploadProgress.style.display = 'block';
    try {
      let dataUrl = await resizeAndCompressImage(file, 1200, 0.75);
      // Falls die Datenbank-Obergrenze (1 MB pro Eintrag) trotzdem knapp wird,
      // nochmal stärker verkleinern.
      if (dataUrl.length > 700 * 1024) {
        dataUrl = await resizeAndCompressImage(file, 900, 0.6);
      }
      selectedImageDataUrl = dataUrl;
      previewImg.src = dataUrl;
      previewWrap.style.display = 'block';
    } catch (err) {
      postError.textContent = 'Bild konnte nicht verarbeitet werden. Bitte anderes Foto versuchen.';
      console.error(err);
      imageInput.value = '';
    } finally {
      uploadProgress.style.display = 'none';
    }
  });

  document.getElementById('remove-image').addEventListener('click', () => {
    selectedImageDataUrl = null;
    imageInput.value = '';
    previewWrap.style.display = 'none';
  });

  document.getElementById('news-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    postError.textContent = '';
    const title = document.getElementById('title').value.trim();
    const text = document.getElementById('text').value.trim();
    const dateInput = document.getElementById('date').value;
    const date = dateInput ? formatDate(dateInput) : formatDate(new Date().toISOString().slice(0, 10));

    try {
      await addDoc(collection(db, "news"), {
        title, text, date,
        imageUrl: selectedImageDataUrl || null,
        createdAt: serverTimestamp()
      });

      e.target.reset();
      selectedImageDataUrl = null;
      previewWrap.style.display = 'none';
      loadExisting();
    } catch (err) {
      postError.textContent = 'Konnte nicht veröffentlicht werden. Bitte nochmal versuchen.';
      console.error(err);
    }
  });

  function formatDate(isoStr) {
    const [y, m, d] = isoStr.split('-');
    return `${d}.${m}.${y}`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function loadExisting() {
    const list = document.getElementById('existing-list');
    const hint = document.getElementById('list-hint');
    hint.textContent = 'Lädt …';
    list.innerHTML = '';

    const q = query(collection(db, "news"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);

    if (snap.empty) {
      hint.textContent = 'Noch keine Einträge.';
      return;
    }
    hint.textContent = '';

    snap.forEach((docSnap) => {
      const n = docSnap.data();
      const row = document.createElement('div');
      row.className = 'existing-item';

      const imgHtml = n.imageUrl ? `<img src="${escapeHtml(n.imageUrl)}" alt="">` : '';
      row.innerHTML = `<div class="row-main">${imgHtml}<div><strong>${escapeHtml(n.title)}</strong><br><span class="muted">${escapeHtml(n.date)}</span></div></div>`;

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Löschen';
      delBtn.type = 'button';
      delBtn.className = 'btn btn-ghost small';
      delBtn.addEventListener('click', async () => {
        if (confirm('Diese Neuigkeit wirklich löschen?')) {
          await deleteDoc(doc(db, "news", docSnap.id));
          loadExisting();
        }
      });

      row.appendChild(delBtn);
      list.appendChild(row);
    });
  }
</script>

</body>
</html>
